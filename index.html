<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart Canteen</title>

  <link rel="stylesheet" href="styles.css">
</head>

<body>

  <!-- Navbar -->
  <header class="navbar">
    <div class="logo">🍽️ Smart Canteen</div>

    <nav>
      <a href="#menu">Menu</a>
      <a href="#cart">Cart</a>
      <button id="logoutBtn">Logout</button>
    </nav>
  </header>

  <!-- Authentication -->
  <section class="auth-container" id="authSection">

    <!-- <!-- Register -->
    <div class="auth-box">
      <h2>Register</h2>

      <input type="text" id="registerName" placeholder="Enter Name">

      <input type="email" id="registerEmail" placeholder="Enter Email">

      <input type="password" id="registerPassword" placeholder="Enter Password">

      <button onclick="registerUser()">
        Register
      </button>
    </div>

    <!-- Login -->
    <div class="auth-box">
      <h2>Login</h2>

      <input type="email" id="loginEmail" placeholder="Enter Email">

      <input type="password" id="loginPassword" placeholder="Enter Password">

      <button onclick="loginUser()">
        Login
      </button>
    </div>

  </section> -->

  <!-- Main App -->
  <div id="mainApp" style="display:none;">

    <!-- Hero -->
    <section class="hero">
      <h1>Welcome to Smart Canteen</h1>

      <p>
        Order delicious food instantly
      </p>
    </section>

    <!-- Menu -->
    <section id="menu" class="container">
      <h2>🍔 Today's Menu</h2>

      <div id="menu-items" class="menu-grid"></div>
    </section>

    <!-- Cart -->
    <section id="cart" class="container">
      <h2>🛒 Your Cart</h2>

      <div id="cart-items" class="cart-grid"></div>

      <div class="cart-summary">
        <h3>Total: ₹<span id="total">0</span></h3>

        <button id="checkout">
          Place Order
        </button>
      </div>
    </section>

  </div>

  <script src="script.js"></script>

</body>
</html>
